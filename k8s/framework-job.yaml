apiVersion: batch/v1

kind: Job

metadata:
  name: automation-framework-job

spec:

  template:

    spec:

      containers:

        - name: automation-framework
          image: automation-framework:latest
          imagePullPolicy: Never

          env:

            - name: BROWSER
              value: chrome

            - name: SUITEXMLFILE
              value: smoke.xml

          command:
            - mvn

          args:
            - test
            - -Dbrowser=$(BROWSER)
            - -DsuiteXmlFile=$(SUITE)

      restartPolicy: Never